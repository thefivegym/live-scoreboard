name: Update data & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily schedule refresh (11:15 UTC = 6:15 AM CT / 5:15 AM CDT-ish). Runs year-round.
    - cron: '15 11 * * *'
    # Every 10 minutes during meet hours, January–April: 16:00–05:59 UTC (≈10 AM–midnight CT).
    - cron: '*/10 16-23 * 1-4 *'
    - cron: '*/10 0-5 * 1-4 *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scoreboard
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build schedule and fallback results from Road to Nationals
        run: node scripts/build-schedule.mjs
      - name: Commit changed data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: update $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: update
    # Deploy on code pushes, manual runs, and whenever the data changed.
    if: >-
      always() && needs.update.result != 'failure' && (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        needs.update.outputs.changed == 'true')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # picks up the data commit made by the update job
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
