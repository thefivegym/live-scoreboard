<body>
<header class="site-header">
  <div class="wrap">
    <h1><span class="brand">The Five That Score</span> <span class="dash">—</span> <span class="sub">Live D1 Scoreboard</span></h1>
    <a class="handle" href="https://x.com/thefivethatscore" target="_blank" rel="noopener">@thefivethatscore</a>
  </div>
</header>

<nav class="datebar" aria-label="Choose date">
  <div class="wrap">
    <button id="prev" class="nav-btn" aria-label="Previous day">‹</button>
    <label class="date-label">
      <span id="date-text" class="date-text"></span>
      <input id="date" type="date" aria-label="Pick a date">
    </label>
    <button id="next" class="nav-btn" aria-label="Next day">›</button>
    <button id="today" class="today-btn">Today</button>
  </div>
</nav>

<main class="wrap">
  <div id="banner" class="banner" hidden></div>
  <div id="status-line" class="status-line" aria-live="polite"></div>
  <section id="meets" class="meets" aria-live="polite"></section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <p>Live scores from <a href="https://virti.us" target="_blank" rel="noopener">Virtius</a>. Schedule and fallback results from <a href="https://www.roadtonationals.com" target="_blank" rel="noopener">Road to Nationals</a>. Times shown in Central Time.</p>
    <p>Built by <a href="https://x.com/thefivethatscore" target="_blank" rel="noopener">The Five That Score</a> · Unofficial; always confirm with official results. · <a id="demo-link" href="?demo">Demo</a></p>
  </div>
</footer>
<script src="app.js" defer></script>
